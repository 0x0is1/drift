<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Abstract mark: a thick open "D" stroke (spine + bulging arc) with a
    play-triangle notched into the bowl, plus three trailing speed-lines
    suggesting drift/motion. Teal #38c999 signature accent on transparent
    ground — this is the adaptive-icon foreground / general mark source.
  -->
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ad9a8"/>
      <stop offset="100%" stop-color="#2a9c75"/>
    </linearGradient>
  </defs>

  <!-- chroma-key plate: screenshotting a transparent SVG bakes opaque
       white into the PNG, so render on magenta and key it out with
       ffmpeg afterwards (see design/logo/render.sh). -->
  <rect x="0" y="0" width="1024" height="1024" fill="#ff00ff"/>

  <!-- speed lines (motion trail), upper-left of the D -->
  <g stroke="#38c999" stroke-linecap="round">
    <line x1="120" y1="420" x2="250" y2="340" stroke-width="26" opacity="0.35"/>
    <line x1="150" y1="480" x2="290" y2="400" stroke-width="26" opacity="0.6"/>
    <line x1="180" y1="540" x2="330" y2="460" stroke-width="26" opacity="0.9"/>
  </g>

  <!-- the D: spine + bulging arc stroke -->
  <path
    d="M 420 258 L 420 766 A 254 254 0 0 0 420 258"
    fill="none"
    stroke="url(#tealGrad)"
    stroke-width="92"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- play triangle sitting in the D's open bowl -->
  <path d="M 560 446 L 684 512 L 560 578 Z" fill="url(#tealGrad)"/>
</svg>
